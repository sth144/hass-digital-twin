# A fictional house, shipped with the repo so the panel has something to show before you
# point it at your own model. Nothing here refers to a real home or a real Home Assistant
# instance; the entity ids are made up, and unknown entities simply render as unavailable.
model: /hass_digital_twin/house/demo-house.glb
background: "#151b22"
camera:
  position: [6.8, 15, 22]
  target: [6.4, 0, 4.6]
areas:
  living_room:
    ha_area_id: living_room
    objects: [area__living_room]
    polygon: [[0, 0], [5.4, 0], [5.4, 4.6], [0, 4.6]]
    camera: { position: [3.4, 9, 12.6], target: [2.7, 0.5, 2.4] }
