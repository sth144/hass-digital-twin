    objects: [area__kitchen]
    polygon: [[5.4, 0], [9.6, 0], [9.6, 4.6], [5.4, 4.6]]
    camera: { position: [7.5, 7, 10.1], target: [7.5, 0.5, 2.3] }
  hallway:
