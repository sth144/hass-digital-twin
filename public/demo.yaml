    camera: { position: [8.2, 6.8, 13.7], target: [8.2, 0.5, 7.9] }
  garage:
    ha_area_id: garage
    objects: [area__garage]
    polygon: [[9.6, 0], [13.6, 0], [13.6, 4.6], [9.6, 4.6]]
